name: Progressive-RL
tags: [pytorch, cuda]
setup_command: >
  . /etc/profile.d/conda.sh;
  conda activate iris &&
  pip install -r requirements.txt &&
  source .env &&
  export HF_TOKEN="${HF_KEY}" &&
  export WANDB_API_KEY="${WANDB_API_KEY}" &&
  wandb login --host=...
command: >
  . /etc/profile.d/conda.sh;
  conda activate iris &&
  COMMAND_PLACEHOLDER
  
is_parent: true
permissions:
  viewers: mlr
project_id: mlr_alotfi
priority: 1
attribution:
  project: LLM-RL
  development_type: training
  foundation_model: false
  model_type: text
  model_size: 7B
  spend: dev

environment_variables:
  FI_EFA_USE_DEVICE_RDMA: '1'
  FI_PROVIDER: efa
  FI_EFA_FORK_SAFE: '1'  # Try to make sure things are fork-friendly for EFA.
  NCCL_ALGO: TREE # One could use Ring as well. 
  NCCL_PROTO: Simple    # EFA provider does not support LL protocols.
  RDMAV_FORK_SAFE: '1'  # Try to make sure things are fork-friendly for libiverbs.
  LD_PRELOAD: /opt/nccl/build/lib/libnccl.so
  LD_LIBRARY_PATH: /opt/amazon/openmpi/lib:/opt/amazon/efa/lib:/opt/aws-ofi-nccl/install/lib:$LD_LIBRARY_PATH
  PATH: /opt/amazon/openmpi/bin/:/opt/amazon/efa/bin:$PATH
  # new settings from Iman
  FI_EFA_SET_CUDA_SYNC_MEMOPS: "0"
  NCCL_DEBUG: "INFO"
  OMP_NUM_THREADS: 16
  NCCL_SOCKET_NTHREADS: 8
  # NCCL_BUFFSIZE: 8388608
  OFI_NCCL_PROTOCOL: "SENDRECV" #only on A100s
  # NCCL_CROSS_NIC: 1 # use only when using FSDP_Hybrid
  # NCCL_NVLS_ENABLE: 1 # use only on H100s


dev_flags:
  AWS_EFA_MOUNT_STATS_MODE_DEV_FLAG: 1
  AWS_EFA_32_NIC: 1
  ENABLE_TASK_GROUP: 1

cluster_options:
  aws:
    instance_type: p4de.24xlarge

resources:
  cluster: aws_2
  num_gpus: 8
  docker_image: ...
  timeout: 14d
  disk_gb: 512.0
  ports: [TENSORBOARD_PORT, BOLT_TAB_samples, JUPYTER_PORT]
  rdma: true
  task_type: 8gpu
