defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: ${model.model_params.monitor}
  mode: "min"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: ${model.model_params.monitor}
  patience: 20
  mode: "min"

model_summary:
  max_depth: -1
